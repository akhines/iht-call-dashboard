function parseDate(dateStr, timeStr) {
  return new Date(dateStr + ' ' + timeStr);
}

function parseDuration(dur) {
  if (!dur || dur === '0s') return 0;
  let total = 0;
  const mMatch = dur.match(/(\d+)m/);
  const sMatch = dur.match(/(\d+)s/);
  if (mMatch) total += parseInt(mMatch[1]) * 60;
  if (sMatch) total += parseInt(sMatch[1]);
  return total;
}

function formatDuration(secs) {
  if (secs === 0) return '0s';
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return m > 0 ? `${m}m ${s}s` : `${s}s`;
}

function isLead(name) {
  const n = name.trim();
  if (n === 'Unknown' || n.toUpperCase().startsWith('NOT A LEAD')) return false;
  return n.startsWith('*');
}

function cleanName(name) {
  let n = name.trim();
  if (n.startsWith('*')) n = n.substring(1);
  return n;
}

function isConnected(row) {
  return row[6] === 'Connected' || row[8] === 'Connected';
}

function addDays(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}

function fmtShortDate(d) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]} ${d.getDate()}`;
}

const calls = CALL_DATA.map((row, i) => {
  const date = parseDate(row[0], row[1]);
  const lead = isLead(row[2]);
  const connected = isConnected(row);
  const durSecs = parseDuration(row[7]);
  const nextDate = lead ? addDays(date, 2 + (i % 2)) : null;
  return {
    id: i,
    date,
    dateStr: row[0],
    timeStr: row[1],
    rawName: row[2],
    name: cleanName(row[2]),
    callerPhone: row[3],
    dialedNumber: row[4],
    numberName: row[5],
    connectedRaw: row[6],
    duration: row[7],
    durationSecs: durSecs,
    connectionStatus: row[8],
    connected,

    recording: row[11],
    pipeline: lead ? 'Seller Lead > Qualified' : 'N/A',
    nextContact: nextDate ? `${fmtShortDate(nextDate)}` : 'N/A'
  };
});

    return calls.filter(c => {
      // Date range
      const diff = (now - c.date) / (1000*60*60*24);
      if (dateRange === 'today' && diff > 1) return false;
      if (dateRange === 'yesterday' && (diff < 1 || diff > 2)) return false;
      if (dateRange === 'week' && diff > 7) return false;
      if (dateRange === 'month' && diff > 31) return false;

      if (numberFilter && c.numberName !== numberFilter) return false;
      if (connFilter === 'connected' && !c.connected) return false;
      if (connFilter === 'missed' && c.connected) return false;

      if (search) {

      return true;

            <select value={connFilter} onChange={e => { setConnFilter(e.target.value); setPage(1); }}
              className="border border-gray-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20">
              <option value="">All Calls</option>
              <option value="connected">Connected</option>
              <option value="missed">Not Connected</option>
            </select>
            {hasFilters && (
              <button onClick={clearFilters}
                className="ml-auto text-sm text-red-500 hover:text-red-700 font-medium transition">
                Clear All
              </button>
            )}
          </div>

          {/* Charts */}
          <div className="grid grid-cols-1 xl:grid-cols-3 gap-4">
            <div className="xl:col-span-2 bg-white rounded-xl shadow-sm border border-gray-100 p-5">
              <h3 className="text-sm font-semibold text-gray-700 mb-4">Daily Call Volume</h3>
              <ResponsiveContainer width="100%" height={250}>
                <BarChart data={dailyData} barGap={2}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0"/>
                  <XAxis dataKey="date" tick={{ fontSize: 11 }} tickFormatter={v => { const parts = v.split(' '); return parts[0] + ' ' + parts[1]; }}/>
                  <YAxis tick={{ fontSize: 11 }} allowDecimals={false}/>
                  <Tooltip contentStyle={{ fontSize: 12, borderRadius: 8 }}/>
                  <Legend wrapperStyle={{ fontSize: 12 }}/>
                  <Bar dataKey="connected" name="Connected" fill={COLORS.connected} radius={[3,3,0,0]} stackId="a"/>
                  <Bar dataKey="missed" name="Missed" fill={COLORS.missed} radius={[3,3,0,0]} stackId="a"/>
                </BarChart>
              </ResponsiveContainer>
            </div>

            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
              <h3 className="text-sm font-semibold text-gray-700 mb-4">Connection Rate</h3>
              <ResponsiveContainer width="100%" height={250}>
                <PieChart>
                  <Pie data={pieData} cx="50%" cy="50%" innerRadius={55} outerRadius={85} dataKey="value" paddingAngle={3}
                    label={({ name, percent }) => `${name} ${(percent * 100).toFixed(0)}%`}>
                    {pieData.map((_, i) => <Cell key={i} fill={PIE_COLORS[i]}/>)}
                  </Pie>
                  <Tooltip contentStyle={{ fontSize: 12, borderRadius: 8 }}/>
                </PieChart>
              </ResponsiveContainer>
            </div>
          </div>

          {/* Calls by tracking number */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
            <h3 className="text-sm font-semibold text-gray-700 mb-4">Calls by Tracking Number</h3>
            <ResponsiveContainer width="100%" height={Math.max(180, numberData.length * 36)}>
              <BarChart data={numberData} layout="vertical" barSize={18}>
                <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0"/>
                <XAxis type="number" tick={{ fontSize: 11 }} allowDecimals={false}/>
                <YAxis type="category" dataKey="name" tick={{ fontSize: 11 }} width={130}/>
                <Tooltip contentStyle={{ fontSize: 12, borderRadius: 8 }}/>
                <Bar dataKey="count" name="Calls" fill={COLORS.blue} radius={[0,4,4,0]}/>
              </BarChart>
            </ResponsiveContainer>
          </div>

          {/* Call log table */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div className="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
              <h3 className="text-sm font-semibold text-gray-700">Call Log</h3>
              <span className="text-xs text-gray-400">{filtered.length} calls</span>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="bg-gray-50 text-left">
                    <th className="px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wider">Date & Time</th>
                    <th className="px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wider">Contact</th>
                    <th className="px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wider">Caller Phone</th>
                    <th className="px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wider">Number Name</th>
                    <th className="px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wider">Connected</th>
                    <th className="px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wider">Duration</th>
                    <th className="px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wider">Recording</th>
                    <th className="px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wider">Pipeline & Stage</th>
                    <th className="px-4 py-3 font-semibold text-gray-500 text-xs uppercase tracking-wider">Next Contact</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-50">
                  {paged.map(c => (
                    <tr key={c.id} className="hover:bg-gray-50/50 transition">
                      <td className="px-4 py-3 whitespace-nowrap">
                        <div className="text-gray-900 font-medium">{c.dateStr}</div>
                        <div className="text-gray-400 text-xs">{c.timeStr}</div>
                      </td>
                      <td className="px-4 py-3 whitespace-nowrap">
                        <div className="flex items-center gap-2">
                          <span className="text-gray-900">{c.name}</span>
                          {c.isLead && <Badge color="blue">LEAD</Badge>}
                        </div>
                      </td>
                      <td className="px-4 py-3 whitespace-nowrap mono text-gray-600">{c.callerPhone}</td>
                      <td className="px-4 py-3 whitespace-nowrap text-gray-600">{c.numberName}</td>
                      <td className="px-4 py-3 whitespace-nowrap">
                        {c.connected ? <Badge color="green">Yes</Badge> : <Badge color="red">No</Badge>}
                      </td>
                      <td className="px-4 py-3 whitespace-nowrap text-gray-600">{c.duration}</td>
                      <td className="px-4 py-3 whitespace-nowrap">
                        {c.recording === 'Recording' ? <Badge color="purple">Recording</Badge> : <span className="text-gray-400 text-xs">—</span>}
                      </td>
                      <td className="px-4 py-3 whitespace-nowrap">
                        {c.pipeline !== 'N/A' ? (
                          <span className="text-sm">
                            <span className="text-blue-600 font-medium">Seller Lead</span>
                            <span className="text-gray-400 mx-1">&rsaquo;</span>
                            <span className="text-gray-600">Qualified</span>
                          </span>
                        ) : <span className="text-gray-400 text-xs">N/A</span>}
                      </td>
                      <td className="px-4 py-3 whitespace-nowrap">
                        {c.nextContact !== 'N/A' ? (
                          <Badge color="amber">{c.nextContact}</Badge>
                        ) : <span className="text-gray-400 text-xs">N/A</span>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {/* Pagination */}
            {totalPages > 1 && (
              <div className="px-5 py-3 border-t border-gray-100 flex items-center justify-between">
                <p className="text-xs text-gray-500">
                  Showing {(page-1)*perPage+1}–{Math.min(page*perPage, filtered.length)} of {filtered.length}
                </p>
                <div className="flex items-center gap-1">
                  <button onClick={() => setPage(Math.max(1, page-1))} disabled={page === 1}
                    className="px-3 py-1.5 text-xs font-medium rounded-lg border border-gray-200 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition">
                    Prev
                  </button>
                  {Array.from({ length: totalPages }, (_, i) => (
                    <button key={i} onClick={() => setPage(i+1)}
                      className={`px-3 py-1.5 text-xs font-medium rounded-lg border transition ${page === i+1 ? 'bg-blue-500 text-white border-blue-500' : 'border-gray-200 hover:bg-gray-50'}`}>
                      {i+1}
                    </button>
                  ))}
                  <button onClick={() => setPage(Math.min(totalPages, page+1))} disabled={page === totalPages}
                    className="px-3 py-1.5 text-xs font-medium rounded-lg border border-gray-200 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed transition">
                    Next
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
